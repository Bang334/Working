<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page_title }} - Hong Ming Global</title>
  <meta name="description" content="Hệ thống Quản lý Dự án & Soạn thảo Văn bản Thông minh Hong Ming Global PM Portal.">

  <!-- Google Fonts: Merriweather (Default App Font) & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700&family=Merriweather+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Core Styles -->
  <link rel="stylesheet" href="/static/css/theme.css?v=4.2">
  <link rel="stylesheet" href="/static/css/layout.css?v=4.1">
  <link rel="stylesheet" href="/static/css/components.css?v=4.0">
  <link rel="stylesheet" href="/static/css/contract_preview.css?v=4.0">
  <link rel="stylesheet" href="/static/css/reminder_preview.css?v=4.0">
  <link rel="stylesheet" href="/static/css/sidebar_customizer.css?v=1.0">

  <!-- Khóa ẩn các tab sidebar tức thì chống giật giao diện (zero-flicker) -->
  <script>
    (function() {
      try {
        var hidden = JSON.parse(localStorage.getItem('hm_hidden_sidebar_tabs') || '[]');
        if (Array.isArray(hidden) && hidden.length > 0) {
          var style = document.createElement('style');
          style.id = 'hm-sidebar-hidden-css';
          style.textContent = hidden.map(function(id) {
            return '.nav-item[data-nav-id="' + id + '"] { display: none !important; }';
          }).join('\n');
          document.head.appendChild(style);
        }
      } catch(e) {}
    })();
  </script>

  <!-- Dynamic Font Engine: Áp dụng font tức thì không cần reload hay sửa code -->
  <script>
    (function() {
      window.ensureGoogleFontLoaded = function(fontName) {
        if (!fontName) return;
        var fontSlug = fontName.replace(/\s+/g, '+');
        var linkId = 'gfont-dynamic-' + fontName.toLowerCase().replace(/[^a-z0-9]/g, '-');
        if (!document.getElementById(linkId)) {
          var link = document.createElement('link');
          link.id = linkId;
          link.rel = 'stylesheet';
          link.href = 'https://fonts.googleapis.com/css2?family=' + fontSlug + ':ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap';
          document.head.appendChild(link);
        }
      };

      window.applyFontGlobally = function(fontObj, persist) {
        if (!fontObj || !fontObj.name) return;
        window.ensureGoogleFontLoaded(fontObj.name);
        var familyStr = "'" + fontObj.name + "', 'Microsoft JhengHei', '微軟正黑體', -apple-system, BlinkMacSystemFont, sans-serif, serif";
        document.documentElement.style.setProperty('--font-sans', familyStr);
        document.documentElement.style.setProperty('--font-serif', familyStr);
        document.body && (document.body.style.fontFamily = familyStr);

        if (persist !== false) {
          try {
            localStorage.setItem('hm_portal_active_font', JSON.stringify(fontObj));
            // Gửi lưu về backend server
            fetch('/api/v1/fonts/active', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(fontObj)
            }).catch(function(e) { console.warn('Could not persist font to server:', e); });
          } catch(e) {}
        }
      };

      // Tự động kích hoạt ngay khi mở trang
      try {
        var rawSaved = localStorage.getItem('hm_portal_active_font');
        if (rawSaved) {
          var parsed = JSON.parse(rawSaved);
          if (parsed && parsed.name) {
            window.ensureGoogleFontLoaded(parsed.name);
            var familyStr = "'" + parsed.name + "', 'Microsoft JhengHei', '微軟正黑體', -apple-system, BlinkMacSystemFont, sans-serif, serif";
            document.documentElement.style.setProperty('--font-sans', familyStr);
            document.documentElement.style.setProperty('--font-serif', familyStr);
          }
        }
      } catch(e) {}
    })();
  </script>
  {% block head %}{% endblock %}
</head>
<body>

  <a class="skip-link" href="#main-content">Chuyển đến nội dung chính</a>

  <div class="app-container">
    <!-- Sidebar -->
    {% include "components/sidebar.html" %}

    <!-- Main Workspace -->
    <main class="app-main" id="main-content" tabindex="-1">
      {% include "components/header.html" %}

      <!-- Content Injection -->
      {% block content %}{% endblock %}
    </main>
  </div>

  <!-- Global Toast Notifications -->
  <div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>

  <!-- Global Loading Overlay -->
  <div class="loading-overlay" id="globalLoadingOverlay" role="status" aria-live="polite" aria-hidden="true" style="display: none;">
    <div class="spinner" style="width: 42px; height: 42px; border-width: 3px;"></div>
    <div class="loading-text" id="loadingOverlayText">Đang xử lý dữ liệu...</div>
  </div>

  <!-- 247Express Shipping Widget & Floating Trigger -->
  {% include "components/shipping_247_modal.html" %}

  <!-- Client Scripts -->
  <script src="/static/js/api_client.js?v=4.0"></script>
  <script src="/static/js/contract_editor.js?v=4.0"></script>
  <script src="/static/js/app.js?v=4.1"></script>
  <script src="/static/js/sidebar_customizer.js?v=1.0"></script>
  <script>
    // Global sidebar unread reminders alert check
    async function refreshSidebarRemindersAlert() {
      try {
        const res = await fetch("/api/v1/custom-reminders/due-count");
        if (!res.ok) return;
        const data = await res.json();
        const badge = document.getElementById("sidebarReminderBadge");
        const dot = document.getElementById("sidebarReminderDot");
        if (!badge || !dot) return;

        const totalDue = data.total_due || 0;
        if (totalDue > 0) {
          badge.textContent = totalDue > 99 ? "99+" : totalDue;
          badge.style.display = "inline-flex";
          dot.style.display = "block";
          let tip = "";
          if (data.overdue_count > 0 && data.today_count > 0) {
            tip = `${data.overdue_count} việc quá hạn, ${data.today_count} việc đến hạn hôm nay!`;
          } else if (data.overdue_count > 0) {
            tip = `${data.overdue_count} việc quá hạn chưa xử lý!`;
          } else {
            tip = `${data.today_count} việc cần thực hiện hôm nay!`;
          }
          badge.title = tip;
          dot.title = tip;
        } else {
          badge.style.display = "none";
          dot.style.display = "none";
        }
      } catch (e) {
        // Silent catch for background notification check
      }
    }
    document.addEventListener("DOMContentLoaded", refreshSidebarRemindersAlert);
  </script>
  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      try {
        const response = await fetch('/api/workflows');
        if (!response.ok) return;
        const data = await response.json();
        const count = data.cases.filter(item => item.attention && item.queue_group === 'active').length;
        const kinds={'/quotations':['quotation'],'/contracts':['contract'],'/repair-contracts':['contract'],
          '/po':['procurement'],'/delivery':['delivery'],'/acceptance':['acceptance'],
          '/tracker':['contract','payment','acceptance','delivery','warranty'],'/receivables':['payment']};
        const relevant=kinds[location.pathname];
        if(relevant){
          const section=document.createElement('details');
          section.style.cssText='flex:0 0 auto;max-height:200px;overflow:auto;margin:12px 0;padding:14px;border:1px solid #dbe5ef;border-radius:12px;background:#fff;color:#123047';
          const summary=document.createElement('summary');summary.textContent='Công việc và hồ sơ liên quan · dùng chung với Việc cần làm';section.append(summary);
          const description=document.createElement('p');description.textContent='Mở đúng công việc để xem bản ký, thư Outlook, bước đang chờ và xác nhận nghiệp vụ. Dữ liệu nguồn được đối chiếu lại khi mở trang.';section.append(description);
          const ul=document.createElement('ul');
          data.cases.filter(x=>relevant.includes(x.kind)).forEach(x=>{
            const li=document.createElement('li'),a=document.createElement('a');a.href='/workflows?case='+x.id;
            a.textContent=x.title+' · '+x.customer+' · '+(x.queue_label || x.current?.title || 'Đã hoàn tất')+
              (x.business_confirmations?.length ? ' · Có xác nhận nghiệp vụ' : '');li.append(a);ul.append(li);
          });section.append(ul);document.querySelector('#main-content > header')?.after(section);
        }
        const badge = document.getElementById('workflowCount');
        if (badge && count) { badge.textContent = count; badge.style.display = ''; badge.title = count + ' việc cần xử lý hoặc gần hạn'; }
      } catch (error) { console.debug('Chưa tải được danh sách việc cần làm'); }
    });
  </script>
  {% block scripts %}{% endblock %}

</body>
</html>
