<!-- Modal Tùy Chỉnh Ẩn / Hiện Các Tab Menu Điều Hướng -->
<div class="sc-modal-overlay" id="scModalOverlay" role="dialog" aria-modal="true" aria-labelledby="scModalTitle">
  <div class="sc-modal-card">
    <!-- Header -->
    <div class="sc-modal-header">
      <div>
        <div class="sc-header-title" id="scModalTitle">
          <svg class="icon" viewBox="0 0 24 24" width="20" height="20" style="color: #2563eb;"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>Tùy Chỉnh Ẩn / Hiện Menu Điều Hướng</span>
        </div>
        <div class="sc-header-subtitle">
          Ẩn bớt các tab bạn chưa cần hoặc do cấp trên trực tiếp đàm phán (ví dụ: Báo giá). Bạn có thể bật hiện lại bất cứ lúc nào.
        </div>
      </div>
      <button type="button" class="sc-close-btn" onclick="SidebarTabManager.closeModal()" title="Đóng cửa sổ">✕</button>
    </div>

    <!-- Quick Bar -->
    <div class="sc-quick-bar">
      <div class="sc-quick-actions">
        <button type="button" class="sc-quick-btn" onclick="SidebarTabManager.showAll()">
          👁️ Hiện tất cả các tab
        </button>
        <button type="button" class="sc-quick-btn" onclick="SidebarTabManager.resetDefault()">
          ↺ Đặt lại mặc định
        </button>
      </div>
      <div style="font-size: 0.73rem; color: #64748b;">
        💡 Gạt công tắc sang trái để ẩn tab
      </div>
    </div>

    <!-- Dynamic Body -->
    <div class="sc-modal-body" id="scModalBody">
      <!-- Sẽ được render động bởi SidebarTabManager -->
    </div>

    <!-- Footer -->
    <div class="sc-modal-footer">
      <div class="sc-footer-stats" id="scFooterStats">
        Đang hiển thị 9/9 tab
      </div>
      <div class="sc-footer-actions">
        <button type="button" class="btn btn-outline btn-sm" onclick="SidebarTabManager.closeModal()">
          ✕ Hủy bỏ
        </button>
        <button type="button" class="btn btn-primary btn-sm" onclick="SidebarTabManager.saveChanges()" style="font-weight: 700; padding: 0.45rem 1rem;">
          💾 Lưu & Áp Dụng Ngay
        </button>
      </div>
    </div>
  </div>
</div>
