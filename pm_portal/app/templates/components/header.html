<header class="app-header">
  <div class="header-left">
    <button class="mobile-nav-toggle" type="button" aria-label="Mở điều hướng" aria-controls="primarySidebar" aria-expanded="false">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="header-heading">
      <span class="header-eyebrow">Hong Ming PM Portal</span>
      <h1 class="page-title">{{ page_title | default("Hong Ming Global PM Portal") }}</h1>
    </div>
  </div>

  <div class="header-right">
    <div class="header-date" aria-label="Ngày làm việc hiện tại">
      <span class="header-date-icon" aria-hidden="true">
        <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
      </span>
      <span>
        <small>Ngày làm việc</small>
        <strong id="currentWorkDate">14/10/2026</strong>
      </span>
    </div>
    <div class="header-trust" title="Giữ nguyên bố cục của mẫu Word và Excel">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
      <span><small>Chế độ tài liệu</small><strong>Bảo toàn bố cục</strong></span>
    </div>
  </div>
</header>
